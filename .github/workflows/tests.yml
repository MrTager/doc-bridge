name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[word,dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: doc-bridge export-skill generated/doc-bridge
      - run: python generated/doc-bridge/scripts/doc_bridge.py doctor
